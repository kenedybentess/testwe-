<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas - Posicionamento Livre</title>
    <!-- Fonte para Código de Barras Real -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">
    <!-- Biblioteca Interact.js para Arrastar e Soltar -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Painel de Controle (Esquerda) */
        .sidebar {
            width: 390px;
            background: #ffffff;
            border-right: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .sidebar h2 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 3px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #555;
            margin-bottom: 2px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        .row-inputs {
            display: flex;
            gap: 6px;
        }

        .row-inputs .form-group {
            flex: 1;
        }

        .elemento-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            position: relative;
        }

        .elemento-box h4 {
            font-size: 11px;
            color: #007bff;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-remover {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-remover:hover {
            background: #bd2130;
        }

        .btn-add {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 8px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .btn-add:hover {
            background: #138496;
        }

        .print-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 10px;
        }

        .print-btn:hover {
            background: #218838;
        }

        /* Área de Visualização (Direita) */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9ecef;
            padding: 20px;
            overflow: auto;
            position: relative;
        }

        #etiqueta {
            background: #ffffff;
            border: 2px solid #999;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* Itens arrastáveis dentro da etiqueta */
        .etiqueta-item-preview {
            position: absolute;
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
            border: 1px dashed #007bff;
            background-color: rgba(0,123,255,0.03);
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .etiqueta-item-preview:hover {
            background-color: rgba(0,123,255,0.1);
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .preview-barcode {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .barcode-font {
            font-family: 'Libre Barcode 39', cursive;
            line-height: 1;
        }

        .barcode-text {
            font-family: Arial, sans-serif;
        }

        .preview-text {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
            padding: 0 2px;
        }

        .preview-linha {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Força a impressão correta da linha usando bordas sólidas */
        .linha-interna {
            background-color: #000 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Regras de Impressão: Remove molduras e bordas tracejadas */
        @media print {
            body { background: none; }
            .sidebar { display: none; }
            .preview-area { background: none; padding: 0; }
            #etiqueta { border: none !important; box-shadow: none !important; }
            .etiqueta-item-preview { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <!-- Painel de Controle -->
    <div class="sidebar">
        <h2>Configurar Etiqueta</h2>
        <div class="row-inputs">
            <div class="form-group">
                <label>Largura (mm):</label>
                <input type="number" id="inputWidth" value="100" oninput="renderizarEtiqueta()">
            </div>
            <div class="form-group">
                <label>Altura (mm):</label>
                <input type="number" id="inputHeight" value="60" oninput="renderizarEtiqueta()">
            </div>
        </div>

        <h2>Elementos da Etiqueta</h2>
        <p style="font-size: 11px; color: #666; margin-bottom: 8px;">Arraste os blocos na tela ao lado para posicionar.</p>
        
        <div id="container-elementos-form"></div>

        <button class="btn-add" onclick="adicionarElemento()">+ Adicionar Elemento</button>
        <button class="btn-add" style="background-color: #6c757d;" onclick="centralizarElementos()">Organizar em Pilha</button>
        <button class="print-btn" onclick="window.print()">Imprimir Etiqueta</button>
    </div>

    <!-- Área Visual -->
    <div class="preview-area">
        <div id="etiqueta"></div>
    </div>

    <script>
        let elementos = [
            { id: 1, tipo: 'texto', valor: 'Cód: PROD-001', x: 5, y: 5, w: 90, h: 7, tamFonte: 12, negrito: true },
            { id: 2, tipo: 'linha', valor: '', x: 5, y: 12, w: 90, h: 1, orientacao: 'horizontal', espessuraLinha: 1 },
            { id: 3, tipo: 'texto', valor: 'Descrição: Peça Industrial Exemplo', x: 5, y: 14, w: 90, h: 7, tamFonte: 10, negrito: false },
            { id: 4, tipo: 'texto', valor: 'Qtd: 50 | Mín: 10', x: 5, y: 22, w: 90, h: 7, tamFonte: 10, negrito: false },
            { id: 5, tipo: 'barcode', valor: 'PROD001', x: 5, y: 30, w: 90, h: 25, tamanhoBarra: 42, distanciaTexto: -2, tamTexto: 9 }
        ];

        let idContador = 6;

        function mmParaPx(mm) {
            return mm * (96 / 25.4);
        }

        function pxParaMm(px) {
            return px / (96 / 25.4);
        }

        function inicializarFormulario() {
            const container = document.getElementById('container-elementos-form');
            container.innerHTML = '';

            elementos.forEach((el) => {
                let htmlCampos = '';

                if (el.tipo === 'texto') {
                    htmlCampos = `
                        <div class="form-group">
                            <label>Texto:</label>
                            <input type="text" value="${el.valor}" oninput="atualizarDado(${el.id}, 'valor', this.value)">
                        </div>
                        <div class="row-inputs">
                             <div class="form-group"><label>Fonte (px):</label><input type="number" value="${el.tamFonte}" oninput="atualizarDado(${el.id}, 'tamFonte', parseInt(this.value))"></div>
                             <div class="form-group"><label>Negrito:</label><select onchange="atualizarDado(${el.id}, 'negrito', this.value === 'true')"><option value="true" ${el.negrito?'selected':''}>Sim</option><option value="false" ${!el.negrito?'selected':''}>Não</option></select></div>
                        </div>
                    `;
                } else if (el.tipo === 'imagem') {
                    htmlCampos = `
                        <div class="form-group">
                            <label>Selecionar do Computador:</label>
                            <input type="file" accept="image/*" onchange="carregarImagemLocal(${el.id}, event)">
                        </div>
                        <div class="form-group">
                            <label>Ou cole a URL da Imagem:</label>
                            <input type="text" value="${el.valor.startsWith('data:') ? '' : el.valor}" placeholder="https://..." oninput="atualizarDado(${el.id}, 'valor', this.value)">
                        </div>
                    `;
                } else if (el.tipo === 'barcode') {
                    htmlCampos = `
                        <div class="form-group">
                            <label>Texto do Código de Barras:</label>
                            <input type="text" value="${el.valor}" oninput="atualizarDado(${el.id}, 'valor', this.value)">
                        </div>
                        <div class="row-inputs">
                            <div class="form-group">
                                <label>Tam. Barras (px):</label>
                                <input type="number" value="${el.tamanhoBarra || 42}" oninput="atualizarDado(${el.id}, 'tamanhoBarra', parseInt(this.value))">
                            </div>
                            <div class="form-group">
                                <label>Distância Texto:</label>
                                <input type="number" value="${el.distanciaTexto !== undefined ? el.distanciaTexto : -2}" oninput="atualizarDado(${el.id}, 'distanciaTexto', parseInt(this.value))">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Tam. Texto Numérico (px):</label>
                            <input type="number" value="${el.tamTexto || 9}" oninput="atualizarDado(${el.id}, 'tamTexto', parseInt(this.value))">
                        </div>
                    `;
                } else if (el.tipo === 'linha') {
                    htmlCampos = `
                        <div class="row-inputs">
                            <div class="form-group">
                                <label>Orientação:</label>
                                <select onchange="atualizarDado(${el.id}, 'orientacao', this.value)">
                                    <option value="horizontal" ${el.orientacao === 'horizontal' ? 'selected' : ''}>Horizontal</option>
                                    <option value="vertical" ${el.orientacao === 'vertical' ? 'selected' : ''}>Vertical</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Espessura (mm):</label>
                                <input type="number" step="0.5" value="${el.espessuraLinha || 1}" oninput="atualizarDado(${el.id}, 'espessuraLinha', parseFloat(this.value))">
                            </div>
                        </div>
                    `;
                }

                const divBox = document.createElement('div');
                divBox.className = 'elemento-box';
                divBox.innerHTML = `
                    <h4>
                        <span>Tipo: ${el.tipo.toUpperCase()}</span>
                        <button class="btn-remover" onclick="removerElemento(${el.id})">Remover</button>
                    </h4>
                    ${htmlCampos}
                    <div class="row-inputs" style="margin-top: 5px;">
                        <div class="form-group"><label>Largura (mm):</label><input type="number" value="${el.w.toFixed(1)}" oninput="atualizarDimensoes(${el.id}, 'w', this.value)"></div>
                        <div class="form-group"><label>Altura (mm):</label><input type="number" value="${el.h.toFixed(1)}" oninput="atualizarDimensoes(${el.id}, 'h', this.value)"></div>
                    </div>
                `;
                container.appendChild(divBox);
            });
        }

        function carregarImagemLocal(id, event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    atualizarDado(id, 'valor', e.target.result);
                };
                leitor.readAsDataURL(arquivo);
            }
        }

        function adicionarElemento() {
            let tipo = prompt("Escolha o tipo do elemento:\n- texto\n- imagem\n- barcode\n- linha", "linha");
            if (!tipo) return;
            tipo = tipo.toLowerCase().trim();

            if(!['texto', 'imagem', 'barcode', 'linha'].includes(tipo)) {
                alert("Tipo inválido.");
                return;
            }

            let novoW = tipo === 'barcode' ? 80 : (tipo === 'imagem' ? 30 : (tipo === 'linha' ? 40 : 90));
            let novoH = tipo === 'barcode' ? 25 : (tipo === 'imagem' ? 20 : (tipo === 'linha' ? 1 : 7));

            elementos.push({
                id: idContador++,
                tipo: tipo,
                valor: tipo === 'texto' ? 'Novo Texto' : (tipo === 'imagem' ? '' : (tipo === 'barcode' ? 'PROD123' : '')),
                x: 5, y: 35, w: novoW, h: novoH,
                tamFonte: 11, negrito: false,
                tamanhoBarra: 42, distanciaTexto: -2, tamTexto: 9,
                orientacao: 'horizontal', espessuraLinha: 1
            });

            renderizarTudo();
        }

        function removerElemento(id) {
            elementos = elementos.filter(e => e.id !== id);
            renderizarTudo();
        }

        function atualizarDado(id, campo, valor) {
            const el = elementos.find(e => e.id === id);
            if (el) {
                el[campo] = valor;
                renderizarEtiqueta();
            }
        }

        function atualizarDimensoes(id, campo, valor) {
            const el = elementos.find(e => e.id === id);
            if (el) {
                el[campo] = parseFloat(valor) || 0.5;
                renderizarEtiqueta();
            }
        }

        function centralizarElementos() {
            let yAtual = 5;
            elementos.forEach(el => {
                el.x = 5;
                el.y = yAtual;
                yAtual += el.h + 2;
            });
            renderizarTudo();
        }

        function renderizarEtiqueta() {
            const larguraMm = parseFloat(document.getElementById('inputWidth').value) || 100;
            const alturaMm = parseFloat(document.getElementById('inputHeight').value) || 60;
            const etiqueta = document.getElementById('etiqueta');

            etiqueta.style.width = mmParaPx(larguraMm) + 'px';
            etiqueta.style.height = mmParaPx(alturaMm) + 'px';

            etiqueta.innerHTML = '';

            elementos.forEach((el) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'etiqueta-item-preview';
                itemDiv.setAttribute('data-id', el.id);
                
                itemDiv.style.left = mmParaPx(el.x) + 'px';
                itemDiv.style.top = mmParaPx(el.y) + 'px';
                itemDiv.style.width = mmParaPx(el.w) + 'px';
                itemDiv.style.height = mmParaPx(el.h) + 'px';

                if (el.tipo === 'texto') {
                    const inner = document.createElement('div');
                    inner.className = 'preview-text';
                    inner.innerText = el.valor;
                    inner.style.fontSize = (el.tamFonte || 11) + 'px';
                    inner.style.fontWeight = el.negrito ? 'bold' : 'normal';
                    itemDiv.appendChild(inner);
                } 
                else if (el.tipo === 'imagem') {
                    if (el.valor && el.valor.trim() !== '') {
                        const img = document.createElement('img');
                        img.className = 'preview-img';
                        img.src = el.valor;
                        itemDiv.appendChild(img);
                    } else {
                        const placeholder = document.createElement('div');
                        placeholder.style.fontSize = '10px';
                        placeholder.style.color = '#888';
                        placeholder.innerText = 'Sem Imagem';
                        itemDiv.appendChild(placeholder);
                    }
                } 
                else if (el.tipo === 'barcode') {
                    if (el.valor && el.valor.trim() !== '') {
                        const bcDiv = document.createElement('div');
                        bcDiv.className = 'preview-barcode';
                        let textoVal = el.valor.toUpperCase();
                        if (!textoVal.startsWith('*')) textoVal = '*' + textoVal;
                        if (!textoVal.endsWith('*')) textoVal = textoVal + '*';

                        let tamBarra = el.tamanhoBarra !== undefined ? el.tamanhoBarra : 42;
                        let distTexto = el.distanciaTexto !== undefined ? el.distanciaTexto : -2;
                        let tamTexto = el.tamTexto !== undefined ? el.tamTexto : 9;

                        bcDiv.innerHTML = `
                            <div class="barcode-font" style="font-size: ${tamBarra}px;">${textoVal}</div>
                            <div class="barcode-text" style="font-size: ${tamTexto}px; margin-top: ${distTexto}px;">${el.valor.toUpperCase()}</div>
                        `;
                        itemDiv.appendChild(bcDiv);
                    }
                }
                else if (el.tipo === 'linha') {
                    const linhaDiv = document.createElement('div');
                    linhaDiv.className = 'preview-linha';
                    let espessuraPx = mmParaPx(el.espessuraLinha || 1);
                    
                    const linhaInterna = document.createElement('div');
                    linhaInterna.className = 'linha-interna';

                    if (el.orientacao === 'vertical') {
                        linhaInterna.style.width = espessuraPx + 'px';
                        linhaInterna.style.height = '100%';
                    } else {
                        linhaInterna.style.width = '100%';
                        linhaInterna.style.height = espessuraPx + 'px';
                    }

                    linhaDiv.appendChild(linhaInterna);
                    itemDiv.appendChild(linhaDiv);
                }

                etiqueta.appendChild(itemDiv);
            });

            ativarArrasto();
        }

        function ativarArrasto() {
            interact('.etiqueta-item-preview').draggable({
                inertia: true,
                modifiers: [
                    interact.modifiers.restrictRect({
                        restriction: 'parent',
                        endOnly: true
                    })
                ],
                autoScroll: true,
                listeners: {
                    move (event) {
                        const target = event.target;
                        const id = parseInt(target.getAttribute('data-id'));
                        const elData = elementos.find(e => e.id === id);

                        if (elData) {
                            elData.x += pxParaMm(event.dx);
                            elData.y += pxParaMm(event.dy);

                            target.style.left = mmParaPx(elData.x) + 'px';
                            target.style.top = mmParaPx(elData.y) + 'px';
                        }
                    }
                }
            });
        }

        function renderizarTudo() {
            inicializarFormulario();
            renderizarEtiqueta();
        }

        window.onload = () => {
            renderizarTudo();
        };
    </script>
</body>
</html>
