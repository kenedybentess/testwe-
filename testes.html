<body>
<div class="sidebar" id="sidebarMount"></div>
<div class="topbar"><h5 class="mb-0"><i class="bi bi-upc-scan"></i> EL250 - REDE + PRINT</h5><div class="d-flex gap-2"><a href="logs.html" class="btn btn-warning btn-sm">Logs</a><a href="etiquetas.html" class="btn btn-info btn-sm">Etiquetas</a><a href="index.html" class="btn btn-light btn-sm">Dashboard</a></div></div>
<div class="content"><div class="container-fluid p-0">

<!-- COMPARTILHADO PRODUTOS + OPERADORES -->
<div class="card config-share mb-3"><div class="card-header bg-warning text-dark d-flex justify-content-between"><b><i class="bi bi-share"></i> CADASTRO COMPARTILHADO (Produtos + Operadores)</b><span class="badge bg-dark">produtos.json</span></div><div class="card-body py-2"><div class="row g-2"><div class="col-md-6"><div class="small fw-bold">Importar/Exportar ativo</div><div class="mt-2 d-flex gap-2 flex-wrap"><button class="btn btn-dark btn-sm" onclick="App.share.exportar()">Exportar Produtos</button><button class="btn btn-outline-dark btn-sm" onclick="App.share.importarClick('produtos')">Importar Produtos</button><button class="btn btn-primary btn-sm" onclick="App.share.exportarOperadores()">Exportar Operadores</button><button class="btn btn-outline-primary btn-sm" onclick="App.share.importarClick('operadores')">Importar Operadores</button><input type="file" id="fileImport" accept=".json" style="display:none"><input type="file" id="fileImportOp" accept=".json" style="display:none"></div></div><div class="col-md-6"><div id="statusShare" class="small p-2 bg-white rounded border">Carregando...</div><div id="statusShareOp" class="small p-2 bg-white rounded border mt-1">Carregando operadores...</div></div></div></div></div>

<!-- REDE LOGS - RESTAURADO PARA \\10.50.1.143\log leitores -->
<div class="card rede-box mb-3"><div class="card-body py-2"><div class="row g-2 align-items-center"><div class="col-md-5"><label class="small fw-bold text-primary"><i class="bi bi-hdd-network"></i> LOGS: \\10.50.1.143\Volume_1\log leitores</label><div class="d-flex gap-2 mt-1"><button class="btn btn-primary btn-sm" onclick="App.rede.selecionarPasta()">Selecionar Pasta Logs</button><button class="btn btn-success btn-sm" onclick="App.rede.forcarSalvar()">Salvar Log Agora</button><button class="btn btn-outline-dark btn-sm" onclick="App.rede.testar()">Testar</button></div></div><div class="col-md-4"><input id="caminhoRede" class="form-control form-control-sm" readonly value="\\10.50.1.143\Volume_1\log leitores"><div id="statusPasta" class="small mt-1 p-1 bg-white rounded border" style="min-height:32px;font-size:11px">Selecione a pasta de rede</div></div><div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" id="chkAutoSalvarRede" checked><label class="form-check-label small fw-bold" for="chkAutoSalvarRede">Salvar auto na rede (\\10.50.1.143)</label></div><div class="form-check"><input class="form-check-input" type="checkbox" id="chkAutoSalvar" checked><label class="small fw-bold" for="chkAutoSalvar">Baixar TXT local também</label></div><div class="form-check"><input class="form-check-input" type="checkbox" id="chkAutoVolta" checked><label class="small fw-bold" for="chkAutoVolta">Voltar auto 3s</label></div><div class="form-check"><input class="form-check-input" type="checkbox" id="chkAutoImprimirEtiqueta" checked><label class="small fw-bold text-success" for="chkAutoImprimirEtiqueta">🖨️ Imprimir etiqueta auto</label></div></div></div></div></div>

<div class="card mb-3" id="cardConfigFixa" style="border:2px solid #0d6efd;border-radius:12px"><div class="card-header bg-primary text-white d-flex justify-content-between"><b><i class="bi bi-gear"></i> CONFIGURAÇÃO FIXA</b><small id="statusConfig" class="badge bg-light text-primary">Carregando...</small></div><div class="card-body"><div class="row g-2"><div class="col-md-4"><label class="small fw-bold">Produto *</label><select id="produtoSel" class="form-select"></select></div><div class="col-md-4"><label class="small fw-bold">Operador *</label><select id="operadorSel" class="form-select"></select></div><div class="col-md-4"><label class="small fw-bold">Modelo *</label><input id="modeloSel" class="form-control" value="46EL250USC01"></div></div><div class="mt-2 d-flex gap-2"><button class="btn btn-primary btn-sm" onclick="App.config.salvar()">Salvar Config</button><button class="btn btn-outline-secondary btn-sm" onclick="App.config.editar()">Editar</button><span class="ms-auto badge bg-success" id="contadorTotal">Total: 0</span></div></div></div>

<div class="card serie-box mb-4" id="cardSerie"><div class="row align-items-end"><div class="col-md-8"><label class="small text-warning fw-bold"><i class="bi bi-upc-scan"></i> NÚMERO DE SÉRIE - BIPE AQUI *</label><input id="serieSel" class="form-control form-control-lg" placeholder="Bipe SN aqui" autocomplete="off" style="font-size:30px;font-weight:900;text-align:center;letter-spacing:2px;text-transform:uppercase"></div><div class="col-md-4"><button class="btn btn-success btn-lg w-100" style="height:58px" onclick="App.teste.iniciar()"><i class="bi bi-play-fill"></i> INICIAR TESTE</button></div></div><div id="msgAutoVolta" class="alert alert-success mt-3" style="display:none"><i class="bi bi-arrow-clockwise"></i> Próximo em <b id="contadorRegressivo">3</b>s... Hoje: <b id="totalHoje">0</b></div></div>

<div id="areaSequencia" style="display:none"><div class="alert alert-info py-2 d-flex justify-content-between"><span><b id="infoResumo"></b></span><span>Início: <b id="horaInicio"></b></span></div><div id="stepsContainer"></div></div>
<div id="resultadoFinal" class="card mt-3" style="display:none"></div>
<div id="comprovante" style="display:none;background:#fff;border:2px solid #000;padding:16px;margin-top:16px;border-radius:8px"></div>
<div id="areaLogTerminal" class="card mt-3" style="display:none"><div class="card-header bg-dark text-white py-2 d-flex justify-content-between"><span>LOG BRUTO</span><span id="statusSalvoRede" class="small"></span></div><div class="log-box" id="logTerminal"></div></div>

<!-- Área de impressão direta (para imprimir sem abrir nova aba) -->
<div id="printEtiqueta"></div>

<script type="module">
import {Storage} from './js/storage.js';
import {renderLayout} from './js/layout.js';
renderLayout('testes.html');
const App={}; window.App=App;

// ---- REDE HANDLES (RESTAURADO) ----
let dirHandleRede=null;
App.rede={
  async selecionarPasta(){
    try{
      if(!window.showDirectoryPicker){ alert('Use Chrome ou Edge para selecionar a pasta de rede'); return; }
      dirHandleRede = await window.showDirectoryPicker({mode:'readwrite'});
      await dirHandleRede.requestPermission({mode:'readwrite'});
      document.getElementById('caminhoRede').value = dirHandleRede.name + ' -> \\\\10.50.1.143\\Volume_1\\log leitores';
      document.getElementById('statusPasta').innerHTML = `<span class="text-success">✅ Pasta: <b>${dirHandleRede.name}</b> selecionada e salva</span>`;
      App.rede.salvarHandleIDB(dirHandleRede, 'pastaRede');
    }catch(e){ document.getElementById('statusPasta').innerHTML = `<span class="text-danger">❌ ${e.message}</span>`; }
  },
  salvarHandleIDB(handle, key='pastaRede'){
    try{
      const req=indexedDB.open('elgin_logs_db',1);
      req.onupgradeneeded=e=>{ try{e.target.result.createObjectStore('handles');}catch{} };
      req.onsuccess=()=>{ try{ const db=req.result; const tx=db.transaction('handles','readwrite'); tx.objectStore('handles').put(handle,key); }catch{} };
    }catch{}
  },
  restaurarHandleIDB(key='pastaRede'){
    return new Promise(res=>{
      try{
        const req=indexedDB.open('elgin_logs_db',1);
        req.onupgradeneeded=e=>{ try{e.target.result.createObjectStore('handles');}catch{} };
        req.onsuccess=()=>{ try{
          const db=req.result;
          if(!db.objectStoreNames.contains('handles')){res(null);return;}
          const tx=db.transaction('handles','readonly');
          const g=tx.objectStore('handles').get(key);
          g.onsuccess=()=>{ if(g.result){ dirHandleRede=g.result; res(g.result);} else res(null); };
          g.onerror=()=>res(null);
        }catch{res(null);} };
        req.onerror=()=>res(null);
      }catch{res(null);}
    });
  },
  async testar(){
    if(!dirHandleRede){ dirHandleRede = await App.rede.restaurarHandleIDB('pastaRede'); if(!dirHandleRede){ alert('Selecione a pasta primeiro'); return; } }
    try{
      const f=await dirHandleRede.getFileHandle('TESTE_'+Date.now()+'.txt',{create:true});
      const w=await f.createWritable(); await w.write('TESTE OK '+new Date().toLocaleString('pt-BR')+' -> \\\\10.50.1.143\\log leitores'); await w.close();
      document.getElementById('statusPasta').innerHTML = `<span class="text-success">✅ Teste OK! Arquivo criado em ${dirHandleRede.name}</span>`;
    }catch(e){ document.getElementById('statusPasta').innerHTML = `<span class="text-danger">❌ Erro: ${e.message}</span>`; }
  },
  async forcarSalvar(){
    if(!window._ultimoLog){ alert('Faça um teste primeiro'); return; }
    await App.rede.salvarLogNaRede(window._ultimoLog);
  },
  async salvarLogNaRede(log){
    if(!dirHandleRede){ dirHandleRede = await App.rede.restaurarHandleIDB('pastaRede'); }
    if(!dirHandleRede){ document.getElementById('statusPasta').innerHTML = `<span class="text-warning">⚠️ Selecione a pasta de rede primeiro (\\10.50.1.143\\log leitores)</span>`; return; }
    try{
      const dataHoje=new Date().toISOString().slice(0,10);
      let pasta=dirHandleRede;
      try{ pasta=await dirHandleRede.getDirectoryHandle('LOGS_'+dataHoje,{create:true}); }catch{}
      const sanitize=(s)=>(s||'').toString().replace(/[\\\/:*?"<>|]/g,'-').slice(0,40);
      const nomeTXT=`${log.log_id}_${sanitize(log.produto)}_${sanitize(log.serie)}_${log.resultado}.txt`;
      const nomeJSON=`${log.log_id}_${sanitize(log.produto)}_${sanitize(log.serie)}_${log.resultado}.json`;
      const f1=await pasta.getFileHandle(nomeTXT,{create:true}); const w1=await f1.createWritable(); await w1.write(window._textoLogAtual||JSON.stringify(log,null,2)); await w1.close();
      const f2=await pasta.getFileHandle(nomeJSON,{create:true}); const w2=await f2.createWritable(); await w2.write(JSON.stringify(log,null,2)); await w2.close();
      document.getElementById('statusPasta').innerHTML = `<span class="text-success">✅ Salvo na rede: ${pasta.name||dirHandleRede.name}/${nomeTXT}</span>`;
      document.getElementById('statusSalvoRede').innerHTML = `<span class="text-success">✅ Rede OK: ${nomeTXT}</span>`;
    }catch(e){
      document.getElementById('statusPasta').innerHTML = `<span class="text-danger">❌ Erro ao salvar na rede: ${e.message}. Verifique permissão da pasta \\10.50.1.143</span>`;
    }
  }
};

// ---- SHARE ----
App.share={
async carregar(){
const s=document.getElementById('statusShare'); const sOp=document.getElementById('statusShareOp');
try{const r=await fetch('./produtos.json?_='+Date.now()); if(r.ok){const j=await r.json(); if(j.length){Storage.set('produtos',j); s.innerHTML=`<span class="text-success">✅ ${j.length} produtos de produtos.json</span>`;}}}catch(e){s.innerHTML=`${Storage.get('produtos',[]).length} produtos cache`;}
try{const r2=await fetch('./operadores.json?_='+Date.now()); if(r2.ok){const j2=await r2.json(); if(j2.length){Storage.set('operadores',j2); sOp.innerHTML=`<span class="text-success">✅ ${j2.length} operadores de operadores.json</span>`; return;}}}catch(e){}
sOp.innerHTML=`${Storage.get('operadores',[]).length} operadores cache`;
},
exportar(){const d=Storage.get('produtos',[]); const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='produtos.json'; a.click();},
exportarOperadores(){const d=Storage.get('operadores',[]); const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='operadores.json'; a.click();},
importarClick(t){ if(t==='operadores') document.getElementById('fileImportOp').click(); else document.getElementById('fileImport').click(); }
};
document.getElementById('fileImport').addEventListener('change',async(e)=>{const f=e.target.files[0]; if(!f)return; const t=await f.text(); try{const j=JSON.parse(t); Storage.set('produtos',j); alert('Produtos: '+j.length); location.reload();}catch{alert('JSON inválido');}});
document.getElementById('fileImportOp').addEventListener('change',async(e)=>{const f=e.target.files[0]; if(!f)return; const t=await f.text(); try{const j=JSON.parse(t); Storage.set('operadores',j); alert('Operadores: '+j.length); location.reload();}catch{alert('JSON inválido');}});

// ---- CONFIG ----
let listaCodigosProduto=[],codigosEsperados={},inicioTimestamp=null,dadosTeste={},contadorInterval=null;
function loadSelects(){const produtos=Storage.get('produtos',[]); const ops=Storage.get('operadores',[]).filter(o=>o.status==='Ativo'); const selP=document.getElementById('produtoSel'); selP.innerHTML='<option value="">Selecione</option>'+produtos.map(p=>`<option value="${Storage.safeText(p.codigo)}" data-modelo="${Storage.safeText(p.modelo)}">${Storage.safeText(p.codigo)} - ${Storage.safeText(p.nome)}</option>`).join(''); const selO=document.getElementById('operadorSel'); selO.innerHTML='<option value="">Selecione</option>'+ops.map(o=>`<option value="${Storage.safeText(o.nome)}">${Storage.safeText(o.matricula)} - ${Storage.safeText(o.nome)}</option>`).join(''); const cfg=Storage.get('config_fixa_teste',null); if(cfg){ selP.value=cfg.produto; selO.value=cfg.operador; document.getElementById('modeloSel').value=cfg.modelo; App.config.bloquear(true); document.getElementById('statusConfig').textContent='Salvo: '+cfg.produto+' / '+cfg.operador; document.getElementById('statusConfig').className='badge bg-success'; } selP.addEventListener('change',()=>{const opt=selP.options[selP.selectedIndex]; if(opt?.dataset.modelo) document.getElementById('modeloSel').value=opt.dataset.modelo;});}
App.config={salvar(){const cfg={produto:document.getElementById('produtoSel').value, operador:document.getElementById('operadorSel').value, modelo:document.getElementById('modeloSel').value}; if(!cfg.produto||!cfg.operador||!cfg.modelo){alert('Preencha tudo');return;} Storage.set('config_fixa_teste',cfg); App.config.bloquear(true); document.getElementById('statusConfig').textContent='Salvo: '+cfg.produto; document.getElementById('statusConfig').className='badge bg-success'; document.getElementById('serieSel').focus();},bloquear(b){document.getElementById('produtoSel').disabled=b; document.getElementById('operadorSel').disabled=b; document.getElementById('modeloSel').disabled=b;},editar(){App.config.bloquear(false); document.getElementById('statusConfig').textContent='Editando...'; document.getElementById('statusConfig').className='badge bg-warning text-dark';}};
function getCodigos(cod){const produtos=Storage.get('produtos',[]); const p=produtos.find(x=>x.codigo===cod); return p?.codigos?.sort((a,b)=>a.ordem-b.ordem)||[];}

// ---- TESTE ----
App.teste={
iniciar(){
if(!Storage.get('config_fixa_teste',null)){alert('Salve a config');return;}
const serie=document.getElementById('serieSel').value.trim().toUpperCase(); if(!serie){alert('Bipe série');return;}
const cfg=Storage.get('config_fixa_teste'); listaCodigosProduto=getCodigos(cfg.produto); if(!listaCodigosProduto.length){alert('Produto sem códigos');return;}
codigosEsperados={}; listaCodigosProduto.forEach((c,i)=>codigosEsperados[i+1]=c.valorEsperado||null);
const container=document.getElementById('stepsContainer'); container.innerHTML=listaCodigosProduto.map((c,i)=>{const idx=i+1; return `<div class="step-card" id="step${idx}"><div class="d-flex justify-content-between"><div><b>${idx} - ${Storage.safeText(c.nome)}</b><br><small class="text-muted">${c.valorEsperado?`Esperado: ${Storage.safeText(c.valorEsperado)}`:'Qualquer'}</small></div><small id="lido${idx}"></small></div><input id="input${idx}" class="form-control input-leitura mt-2" placeholder="${idx===1?'Bipe '+Storage.safeText(c.nome):'Aguardando'}" ${idx!==1?'disabled':''}></div>`;}).join('');
inicioTimestamp=new Date(); document.getElementById('horaInicio').textContent=inicioTimestamp.toLocaleTimeString('pt-BR'); document.getElementById('infoResumo').textContent=`${cfg.produto} | ${cfg.modelo} | Op: ${cfg.operador} | Série: ${serie}`;
dadosTeste={produto:cfg.produto, operador:cfg.operador, modelo:cfg.modelo, serie, leituras:{}, inicio:inicioTimestamp.toISOString(), codigosNomes:listaCodigosProduto};
document.getElementById('areaSequencia').style.display='block'; document.getElementById('resultadoFinal').style.display='none'; document.getElementById('comprovante').style.display='none'; document.getElementById('areaLogTerminal').style.display='none'; document.getElementById('msgAutoVolta').style.display='none'; document.getElementById('cardSerie').style.display='none';
container.querySelectorAll('input').forEach((inp,i)=>{inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); App.teste.validar(i+1,inp.value.trim());}});});
App.teste.ativar(1);
},
ativar(n){document.querySelectorAll('.step-card').forEach((c,i)=>{c.classList.remove('ativo'); if(i+1===n) c.classList.add('ativo');}); const inp=document.getElementById('input'+n); if(!inp)return; inp.disabled=false; inp.classList.add('scan-ativo'); inp.focus();},
validar(step,codigo){if(!codigo)return; const esp=codigosEsperados[step]; const ok=!esp||codigo===esp; const inp=document.getElementById('input'+step); inp.value=codigo; inp.classList.remove('scan-ativo'); inp.disabled=true; document.getElementById('lido'+step).innerHTML=ok?`✅ ${Storage.safeText(codigo)}`:`❌ ${Storage.safeText(codigo)}`; document.getElementById('step'+step).classList.add(ok?'concluido':'erro'); dadosTeste.leituras[step]={codigo, correto:ok, esperado:esp||'LIVRE', nome:listaCodigosProduto[step-1]?.nome||'', timestamp:new Date().toISOString(), hora:new Date().toLocaleTimeString('pt-BR')}; if(step<listaCodigosProduto.length) setTimeout(()=>App.teste.ativar(step+1),250); else setTimeout(()=>App.teste.finalizar(),250);},
async finalizar(){
const fim=new Date(); const todos=Object.values(dadosTeste.leituras).every(l=>l.correto); const res=todos?'APROVADO':'REPROVADO'; const dur=((fim-inicioTimestamp)/1000).toFixed(1);
const teste={id:Date.now().toString(), data:fim.toISOString(), produtoCodigo:dadosTeste.produto, modelo:dadosTeste.modelo, serie:dadosTeste.serie, operador:dadosTeste.operador, resultado:res, leituras:dadosTeste.leituras, duracao:dur};
const testes=Storage.get('testes',[]); testes.unshift(teste); Storage.set('testes',testes);
const log={log_id:'LOG-'+fim.toISOString().slice(0,10).replace(/-/g,'')+'-'+teste.id.slice(-6), teste_id:teste.id, inicio_br:new Date(dadosTeste.inicio).toLocaleString('pt-BR'), fim_br:fim.toLocaleString('pt-BR'), produto:dadosTeste.produto, modelo:dadosTeste.modelo, serie:dadosTeste.serie, operador:dadosTeste.operador, resultado:res, duracao_segundos:dur, leituras:dadosTeste.leituras, codigosNomes:dadosTeste.codigosNomes, hash:btoa(teste.id+'|'+dadosTeste.serie+'|'+res).slice(0,32).toUpperCase()};
const logs=Storage.get('logs_evidencia',[]); logs.unshift(log); Storage.set('logs_evidencia',logs); window._ultimoLog=log;
document.getElementById('resultadoFinal').style.display='block'; document.getElementById('resultadoFinal').innerHTML=`<div class="card-body text-center ${todos?'bg-success':'bg-danger'} text-white rounded"><h3>${res}</h3><p>${Storage.safeText(dadosTeste.produto)} | ${Storage.safeText(dadosTeste.modelo)} | ${Storage.safeText(dadosTeste.serie)}</p></div>`;
App.teste.preencher(log);
App.teste.atualizarContador();
if(document.getElementById('chkAutoSalvar').checked){ App.teste.baixarTXT(log); }
// SALVAR NA REDE \\10.50.1.143\log leitores
if(document.getElementById('chkAutoSalvarRede').checked){ await App.rede.salvarLogNaRede(log); }
// ETIQUETA + PRINT FIX
try{
const prod=Storage.get('produtos',[]).find(p=>p.codigo===log.produto)||{};
const etiqueta={codigo:log.produto, descricao:prod.nome||log.produto, serie:log.serie, modelo:log.modelo, operador:log.operador, resultado:log.resultado, ean13:prod.ean13||'', log_id:log.log_id, hash:log.hash, data:log.fim_br};
localStorage.setItem('etiqueta_para_impressao',JSON.stringify(etiqueta));
window._ultimaEtiqueta=etiqueta;
App.teste.criarEtiquetaPrint(etiqueta);
if(document.getElementById('chkAutoImprimirEtiqueta').checked){
  setTimeout(()=>{ App.teste.imprimirDireto(); }, 600);
}
App.teste.mostrarModalImpressao(log);
}catch(e){console.error(e);}
if(document.getElementById('chkAutoVolta').checked){ App.teste.iniciarContagem(); }
},
criarEtiquetaPrint(etq){
const div=document.getElementById('printEtiqueta');
div.innerHTML=`<div style="width:380px;border:2px solid #000;padding:12px;font-family:Arial,sans-serif">
<div style="display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px"><div><b style="font-size:18px">ELGIN</b><br><small>CNPJ 14.200.166/0005-90</small></div><div style="text-align:right"><div style="font-weight:900">${etq.resultado}</div><small>${etq.log_id||''}</small></div></div>

imprimirDireto(){
const conteudo=document.getElementById('printEtiqueta').innerHTML;
if(!conteudo) return;
const win=window.open('','_blank','width=400,height=500');
win.document.write(`<html><head><title>Etiqueta ${window._ultimaEtiqueta.serie}</title></head><body onload="window.print(); setTimeout(()=>window.close(),500)">${conteudo}</body></html>`);
win.document.close();
},
preencher(log){
document.getElementById('comprovante').style.display='block'; document.getElementById('areaLogTerminal').style.display='block';
document.getElementById('comprovante').innerHTML=`<div class="d-flex justify-content-between border-bottom pb-2"><div><b>ELGIN</b><br><small>CNPJ 14.200.166/0005-90</small></div><div class="text-end"><div style="font-weight:900;font-size:18px">${log.resultado}</div><small>${log.log_id}</small></div></div>
<table class="table table-bordered table-sm mt-2" style="font-size:11px"><tr><td><b>Início</b></td><td>${log.inicio_br}</td><td><b>Fim</b></td><td>${log.fim_br}</td></tr><tr><td><b>Produto</b></td><td>${Storage.safeText(log.produto)}</td><td><b>Modelo</b></td><td>${Storage.safeText(log.modelo)}</td></tr><tr><td><b>Série</b></td><td>${Storage.safeText(log.serie)}</td><td><b>Operador</b></td><td>${Storage.safeText(log.operador)}</td></tr><tr><td><b>Duração</b></td><td>${log.duracao_segundos}s</td><td><b>Hash</b></td><td style="font-family:monospace;font-size:9px">${log.hash}</td></tr></table>

<div class="text-center mt-2 d-flex gap-2 justify-content-center no-print"><button class="btn btn-dark btn-sm" onclick="App.teste.imprimirDireto()">🖨️ Imprimir Etiqueta Direto</button><button class="btn btn-primary btn-sm" onclick="App.teste.baixarTXT(window._ultimoLog)">Baixar TXT</button><button class="btn btn-success btn-sm" onclick="App.teste.voltar()">Próximo</button></div>`;
const txt=`LOG_ID: ${log.log_id}\nPRODUTO: ${log.produto}\nSERIE: ${log.serie}\nRESULTADO: ${log.resultado}\n`+Object.entries(log.leituras).map(([k,v])=>`${k}. ${v.nome} ${v.esperado} => ${v.codigo} [${v.correto?'OK':'FALHA'}]`).join('\n'); document.getElementById('logTerminal').textContent=txt; window._textoLogAtual=txt;

baixarTXT(log){if(!log)return; const blob=new Blob([document.getElementById('logTerminal').textContent],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${log.log_id}_${log.serie}_${log.resultado}.txt`; a.click();},
mostrarModalImpressao(log){

iniciarContagem(){let s=3; document.getElementById('msgAutoVolta').style.display='block'; document.getElementById('contadorRegressivo').textContent=s; document.getElementById('cardSerie').classList.add('piscar'); if(contadorInterval)clearInterval(contadorInterval); contadorInterval=setInterval(()=>{s--; document.getElementById('contadorRegressivo').textContent=s; if(s<=0){clearInterval(contadorInterval); App.teste.voltar();}},1000);},
voltar(){if(contadorInterval)clearInterval(contadorInterval); document.getElementById('serieSel').value=''; document.getElementById('areaSequencia').style.display='none'; document.getElementById('resultadoFinal').style.display='none'; document.getElementById('msgAutoVolta').style.display='none'; document.getElementById('cardSerie').style.display='block'; document.getElementById('cardSerie').classList.remove('piscar'); const mod=document.getElementById('modalImpressao'); if(mod)mod.remove(); document.getElementById('serieSel').focus(); App.teste.atualizarContador();},
atualizarContador(){const testes=Storage.get('testes',[]); const hoje=new Date().toISOString().slice(0,10); const hojeQtd=testes.filter(t=>t.data?.slice(0,10)===hoje).length; document.getElementById('contadorTotal').textContent=`Total: ${testes.length} | Hoje: ${hojeQtd}`; const el=document.getElementById('totalHoje'); if(el)el.textContent=hojeQtd;}
};
