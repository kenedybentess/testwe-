<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitores PRO - Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <h2 class="text-center mb-4 fw-bold text-primary"><i class="bi bi-cpu"></i> Leitores PRO</h2>
    <div class="mb-3"><label>Usuário</label><input id="user" class="form-control" value="admin"></div>
    <div class="mb-3"><label>Senha</label><input id="pass" type="password" class="form-control" value="123"></div>
    <div id="loginErro" class="text-danger small mb-2" style="display:none">Usuário ou senha inválido</div>
    <button class="btn btn-primary w-100" id="btnLogin">Entrar</button>
    <small class="text-muted d-block mt-3 text-center">v2.0 - Multi-PC via produtos.json</small>
  </div>
</div>

<div id="app" style="display:none">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="topbar"><h5 class="mb-0">Dashboard</h5><div id="nomeUsuario" class="badge bg-light text-dark border">Admin</div></div>
  <div class="content">
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="card card-pro p-3"><h6 class="text-muted">Total Testes</h6><div class="fs-2 fw-bold" id="totalTestes">0</div></div></div>
      <div class="col-md-3"><div class="card card-pro p-3"><h6 class="text-muted">Aprovados</h6><div class="fs-2 fw-bold text-success" id="totalAprovados">0</div></div></div>
      <div class="col-md-3"><div class="card card-pro p-3"><h6 class="text-muted">Reprovados</h6><div class="fs-2 fw-bold text-danger" id="totalReprovados">0</div></div></div>
      <div class="col-md-3"><div class="card card-pro p-3"><h6 class="text-muted">Produtos</h6><div class="fs-2 fw-bold" id="totalProdutos">0</div></div></div>
    </div>
    <div class="card card-pro">
      <div class="card-header bg-white"><h6 class="mb-0"><i class="bi bi-clock-history"></i> Últimos Testes</h6></div>
      <div class="card-body"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Série</th><th>Produto</th><th>Operador</th><th>Resultado</th><th>Data</th></tr></thead><tbody id="ultimosTestes"></tbody></table></div></div>
    </div>
  </div>
</div>

<script type="module">
import {login, checkAuth} from './js/auth.js';
import {renderLayout} from './js/layout.js';
import {Storage} from './js/storage.js';

function atualizarDashboard(){
  const testes = Storage.get('testes',[]);
  const produtos = Storage.get('produtos',[]);
  document.getElementById('totalTestes').textContent = testes.length;
  document.getElementById('totalAprovados').textContent = testes.filter(t=>t.resultado==='APROVADO').length;
  document.getElementById('totalReprovados').textContent = testes.filter(t=>t.resultado==='REPROVADO').length;
  document.getElementById('totalProdutos').textContent = produtos.length;
  const tbody = document.getElementById('ultimosTestes');
  tbody.innerHTML = testes.slice(-10).reverse().map(t=>`<tr><td><b>${Storage.safeText(t.serie)}</b></td><td>${Storage.safeText(t.produto)}</td><td>${Storage.safeText(t.operador)}</td><td><span class="badge ${t.resultado==='APROVADO'?'bg-success':'bg-danger'}">${t.resultado}</span></td><td><small>${t.fim_br||''}</small></td></tr>`).join('') || '<tr><td colspan=5 class="text-center text-muted">Nenhum teste</td></tr>';
}

async function initProdutos(){
  try{
    const r = await fetch('./produtos.json?_='+Date.now());
    if(r.ok){ const j = await r.json(); if(j.length){ Storage.set('produtos', j); } }
  }catch{}
  if(Storage.get('produtos',[]).length===0){
    const r = await fetch('./produtos.json'); 
    try{ Storage.set('produtos', await r.json()); }catch{}
  }
}

document.getElementById('btnLogin').onclick = async ()=>{
  const u=document.getElementById('user').value, p=document.getElementById('pass').value;
  if(login(u,p)){
    document.getElementById('loginPage').style.display='none';
    document.getElementById('app').style.display='block';
    renderLayout('index.html');
    await initProdutos();
    atualizarDashboard();
  }else{
    document.getElementById('loginErro').style.display='block';
  }
};
if(checkAuth()){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').style.display='block';
  renderLayout('index.html');
  initProdutos().then(atualizarDashboard);
}
</script>
</body>
</html>
